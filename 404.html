<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Page introuvable — SomSom</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16x16.png">
<link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png">
<meta name="theme-color" content="#0B1230">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
  .notfound { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 24px; }
  .notfound img { width: min(260px, 70vw); animation: float 5s ease-in-out infinite; margin-bottom: 8px; }
  .notfound h1 { font-family: var(--font-display); font-size: clamp(26px, 6vw, 38px); margin: 10px 0 10px; }
  .notfound p { color: var(--text-secondary); font-size: 15px; max-width: 420px; margin: 0 0 28px; line-height: 1.6; }
  .notfound a.home-btn { display: inline-block; background: var(--accent-blue); color: #fff; font-weight: 700; padding: 12px 26px; border-radius: 999px; text-decoration: none; }
</style>
</head>
<body>

<div class="sky"></div>
<div class="stars"></div>

<main class="notfound">
  <img src="assets/hero.png" alt="">
  <h1>Ce nuage s'est égaré</h1>
  <p>La page que tu cherches n'existe pas, ou a changé d'adresse.</p>
  <a class="home-btn" href="index.html">Retour à l'accueil</a>
</main>

<script src="main.js"></script>
</body>
</html>
